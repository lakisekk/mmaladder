<style>
  /* MMA Ladder — black & white, colour only where it carries meaning (flags, organisations, champion, movement) */
  :root {
    --bg: #000;
    --ink: #fff;
    --ink-2: #b8b8b8;
    --ink-3: #7c7c7c;
    --rule: #242424;
    --rule-2: #3a3a3a;
    --hover: #0d0d0d;
    --gold: #d9b45a;
    --up: #3ccb7f;
    --down: #ff5c5c;
    --draw: #8fa3b8;
    --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --w: 1160px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; font-feature-settings: "tnum" 1; }
  main { flex: 1; }
  a { color: inherit; text-decoration: none; }
  button, select, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
  .wrap { width: 100%; max-width: var(--w); margin-left: auto; margin-right: auto; padding-left: 24px; padding-right: 24px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .muted { color: var(--ink-3); font-size: 15px; }
  .muted.small { font-size: 13px; margin: 10px 0 0; }
  .muted a, .prose a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-2); }
  .muted a:hover, .prose a:hover { text-decoration-color: var(--ink); }

  /* ---------- header ---------- */
  header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--rule); }
  .top .wrap { display: flex; align-items: center; gap: 28px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand img { width: 34px; height: 34px; display: block; }
  .brand span { font-family: var(--display); font-weight: 800; font-size: 25px; letter-spacing: .01em; line-height: 1; text-transform: uppercase; }
  .brand span b { font-weight: 800; color: var(--ink-3); margin-left: 4px; }
  .mainnav { display: flex; gap: 22px; font-size: 15px; color: var(--ink-3); }
  .mainnav a:hover, .mainnav a.on { color: var(--ink); }
  .search { position: relative; margin-left: auto; width: 260px; }
  .search input { width: 100%; height: 38px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--bg); color: var(--ink); padding: 0 12px 0 36px; font-size: 15px; outline: none; }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus { border-color: var(--ink); }
  .search svg { position: absolute; left: 12px; top: 11px; width: 16px; height: 16px; color: var(--ink-3); pointer-events: none; }
  .results { position: absolute; top: 44px; left: 0; right: 0; background: #0a0a0a; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; display: none; }
  .results.open { display: block; }
  .results button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--rule); }
  .results button:last-child { border-bottom: 0; }
  .results button:hover, .results button.active { background: #161616; }
  .results .r-name { font-weight: 600; font-size: 15px; display: block; }
  .results .r-sub { color: var(--ink-3); font-size: 13px; display: block; }
  .results .empty { padding: 12px; color: var(--ink-3); font-size: 14px; }
  .lang { display: inline-flex; gap: 2px; flex-shrink: 0; }
  .lang button { height: 30px; min-width: 32px; padding: 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-3); border-radius: 4px; }
  .lang button:hover { color: var(--ink); }
  .lang button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); border-radius: 0; }

  /* ---------- intro (home only) ---------- */
  .intro { padding-top: 44px; }
  .intro h1 { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 7vw, 76px); line-height: .9; margin: 0; text-transform: uppercase; letter-spacing: -.005em; }
  .intro p { margin: 14px 0 0; color: var(--ink-2); font-size: 17px; max-width: 58ch; }

  /* ---------- ranking selectors ---------- */
  .controls { padding-top: 32px; }
  .scopes { display: flex; gap: 28px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
  .scopes::-webkit-scrollbar, .divs::-webkit-scrollbar { display: none; }
  .scopes a { padding: 0 0 12px; font-size: 17px; font-weight: 600; color: var(--ink-3); white-space: nowrap; box-shadow: inset 0 -2px 0 transparent; }
  .scopes a:hover { color: var(--ink-2); }
  .scopes a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
  .subs { display: flex; gap: 22px; flex-wrap: wrap; padding-top: 16px; }
  .sub { display: inline-flex; align-items: center; gap: 9px; font-size: 15px; color: var(--ink-3); }
  .sub:hover { color: var(--ink-2); }
  .sub.on { color: var(--ink); font-weight: 600; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  .divs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-top: 16px; }
  .div-btn { padding: 7px 12px; font-size: 14px; color: var(--ink-3); white-space: nowrap; border-radius: 4px; }
  .div-btn:hover { color: var(--ink); background: var(--hover); }
  .div-btn.on { color: var(--bg); background: var(--ink); font-weight: 600; }
  .div-btn sup { font-size: 11px; margin-left: 4px; opacity: .55; vertical-align: 2px; }

  /* ---------- page layout: board + side column ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 56px; padding-top: 36px; padding-bottom: 72px; align-items: start; }
  .layout.solo { grid-template-columns: minmax(0, 1fr); }

  /* ---------- board ---------- */
  .board-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-bottom: 18px; }
  .board-title { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 6vw, 64px); line-height: .88; margin: 0; letter-spacing: -.005em; }
  .board-head .meta { color: var(--ink-3); font-size: 14px; margin-top: 10px; display: flex; gap: 18px; flex-wrap: wrap; }
  .head-right { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; color: var(--ink-3); font-size: 14px; }
  .scope-tag { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
  .asof { display: inline-flex; align-items: center; gap: 8px; }
  .asof select { height: 32px; border-radius: 4px; border: 1px solid var(--rule-2); background: var(--bg); padding: 0 8px; font-size: 13px; }
  .notice-hidden { border-left: 2px solid var(--ink-3); color: var(--ink-2); padding: 6px 12px; margin-bottom: 16px; font-size: 14px; }
  .history-note { color: var(--gold); font-size: 14px; margin: 0 0 12px; }

  /* the ladder: rank numerals sit in a rail, every row is a rung */
  .list { border-top: 1px solid var(--rule-2); }
  .row { display: grid; grid-template-columns: 84px 52px minmax(0, 1fr) auto; align-items: center; min-height: 76px; border-bottom: 1px solid var(--rule); }
  .row:hover { background: var(--hover); }
  .rank { align-self: stretch; display: flex; align-items: center; justify-content: flex-end; padding-right: 18px; border-right: 1px solid var(--rule-2); font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; }
  .row.top1 { min-height: 104px; }
  .row.top1 .rank { font-size: 76px; }
  .rank.c { color: var(--gold); font-size: 44px; }
  .row.is-champ { box-shadow: inset 3px 0 0 var(--gold); min-height: 96px; }
  .row.is-champ .rank { font-size: 56px; }
  .row.is-champ + .row.top1 { min-height: 88px; }
  .row.is-champ + .row.top1 .rank { font-size: 56px; }
  .move { font-size: 13px; font-weight: 600; text-align: center; }
  .move.up { color: var(--up); } .move.down { color: var(--down); } .move.same { color: var(--ink-3); }
  .move.new { color: var(--ink-2); font-size: 12px; }
  .move.champ { color: var(--gold); font-size: 12px; }
  .who { display: flex; align-items: center; gap: 16px; min-width: 0; padding: 12px 0; }
  .flag { width: 30px; height: 20px; object-fit: cover; border-radius: 2px; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.14); background: #1c1c1c; display: inline-block; }
  .flag-lg { width: 54px; height: 36px; }
  .flag-text { font-size: 9px; font-weight: 700; color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; }
  .flag-empty { background: #161616; }
  .who-text { min-width: 0; }
  .name { display: block; font-weight: 600; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.top1 .name, .row.is-champ .name { font-size: 22px; }
  .sub-line { display: flex; align-items: center; gap: 14px; margin-top: 3px; font-size: 13px; color: var(--ink-3); flex-wrap: wrap; }
  .org { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
  .org i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .nick { font-style: italic; }
  .sep { display: none; }
  .divtag { color: var(--ink-3); }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; padding: 0 16px 0 12px; }
  .record { font-size: 16px; color: var(--ink-2); }
  .lastfight { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .lastfight .ev { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .res { display: inline-grid; place-items: center; min-width: 20px; height: 18px; padding: 0 4px; border-radius: 3px; font-size: 11px; font-weight: 700; color: #000; }
  .res-w { background: var(--up); } .res-l { background: var(--down); } .res-d, .res-nc { background: var(--draw); }
  .rec-inline { display: none; }
  .empty-state { padding: 48px 0; color: var(--ink-3); border-bottom: 1px solid var(--rule); }

  /* ---------- side column ---------- */
  .side { display: grid; gap: 40px; position: sticky; top: 96px; }
  .side h2 { font-family: var(--display); font-weight: 800; font-size: 28px; text-transform: uppercase; margin: 0; line-height: 1; }
  .side .note { color: var(--ink-3); font-size: 14px; margin: 6px 0 14px; }
  .mv-group + .mv-group { margin-top: 18px; }
  .mv-group h3 { font-size: 14px; font-weight: 600; color: var(--ink-2); margin: 0 0 4px; }
  .mover { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 4px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .mover:hover .mv-name { text-decoration: underline; text-underline-offset: 3px; }
  .mv-delta { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; }
  .mv-delta.up { color: var(--up); } .mv-delta.down { color: var(--down); }
  .mv-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mv-who > span { min-width: 0; }
  .mv-who .flag { width: 22px; height: 15px; }
  .mv-name { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mv-where { display: block; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-about p { color: var(--ink-2); font-size: 15px; margin: 8px 0 10px; }
  .side-about a { font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-2); }
  .side-about a:hover { text-decoration-color: var(--ink); }

  /* ---------- fighter page ---------- */
  .fighter { padding-top: 28px; padding-bottom: 80px; }
  .crumbs { display: flex; gap: 8px; color: var(--ink-3); font-size: 14px; margin-bottom: 28px; }
  .crumbs a:hover { color: var(--ink); }
  .f-hero { position: relative; padding-bottom: 28px; border-bottom: 1px solid var(--rule-2); }
  .f-hero .bgflag { display: none; }
  .f-hero h1 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: clamp(52px, 9vw, 104px); line-height: .86; margin: 16px 0 0; letter-spacing: -.005em; }
  .nickbig { color: var(--ink-3); font-style: italic; margin-top: 10px; font-size: 18px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, max-content)); gap: 12px 48px; margin-top: 28px; }
  .fact small { display: block; font-size: 13px; color: var(--ink-3); margin-bottom: 3px; }
  .fact div { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; }
  .f-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 56px; margin-top: 40px; }
  .f-card { min-width: 0; }
  .f-card + .f-card { margin-top: 0; }
  .fighter > .f-card { margin-top: 48px; }
  .f-card h2 { font-family: var(--display); font-weight: 800; font-size: 28px; text-transform: uppercase; margin: 0 0 12px; line-height: 1; }
  .standing { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--rule); }
  .standing:first-of-type { border-top: 1px solid var(--rule-2); }
  .st-title { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; }
  .st-sub { display: block; font-size: 13px; color: var(--ink-3); }
  .st-rank { font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 1; }
  .st-rank.c { color: var(--gold); font-size: 22px; }
  .standing:hover .st-title { text-decoration: underline; text-underline-offset: 3px; }
  .chart-tabs { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; border-bottom: 1px solid var(--rule); }
  .chart-tabs button { font-size: 14px; padding: 0 0 8px; color: var(--ink-3); box-shadow: inset 0 -2px 0 transparent; }
  .chart-tabs button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
  .chart { width: 100%; height: auto; display: block; }
  .chart .g { stroke: var(--rule); stroke-width: 1; }
  .chart .tl { fill: var(--ink-3); font-size: 12px; font-family: var(--body); }
  .chart .ln { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .d { fill: var(--bg); stroke: var(--ink); stroke-width: 2; }
  .chart .dc { fill: var(--gold); stroke: var(--gold); }
  .fights { border-top: 1px solid var(--rule-2); }
  .fight { display: grid; grid-template-columns: 36px minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .f-opp { display: flex; align-items: center; gap: 10px; font-weight: 600; min-width: 0; }
  .f-opp a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .f-opp .flag { width: 24px; height: 16px; }
  .f-meth { color: var(--ink-2); }
  .f-ev { color: var(--ink-3); font-size: 14px; min-width: 0; }
  .f-ev small { display: block; font-size: 12px; }
  .socials { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 22px; font-size: 15px; }
  .socials small { font-size: 13px; color: var(--ink-3); }
  .soc { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--rule-2); }
  .soc span { color: var(--ink-3); font-size: 12px; }
  .soc:hover { text-decoration-color: var(--ink); }
  .claim { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 28px; padding: 18px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .claim strong { display: block; font-size: 16px; }
  .claim p { margin: 3px 0 0; color: var(--ink-3); font-size: 14px; max-width: 62ch; }
  .claim-btn { flex-shrink: 0; height: 40px; display: inline-flex; align-items: center; padding: 0 18px; border-radius: 6px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; }
  .claim-btn:hover { background: #d9d9d9; }
  .f-hero + .claim { border-top: 0; margin-top: 0; }
  .claim-small { color: var(--ink-3); font-size: 13px; margin: 20px 0 0; }
  .claim-small a { color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- how we rank ---------- */
  .about { padding-top: 28px; padding-bottom: 80px; max-width: 760px; margin-left: max(24px, calc((100% - var(--w)) / 2 + 24px)); margin-right: auto; padding-left: 0; padding-right: 24px; }
  .about h1 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: clamp(52px, 8vw, 88px); line-height: .88; margin: 0 0 28px; }
  .prose { font-size: 17px; line-height: 1.65; color: var(--ink-2); }
  .prose h2 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 30px; line-height: 1; color: var(--ink); margin: 40px 0 10px; }
  .prose p { margin: 0 0 14px; }
  .prose ul { margin: 0 0 14px; padding-left: 20px; }
  .prose li { margin: 8px 0; }
  .prose strong { color: var(--ink); font-weight: 600; }
  .nf { padding-top: 80px; padding-bottom: 80px; }
  .nf h1 { font-family: var(--display); font-weight: 800; font-size: 64px; text-transform: uppercase; margin: 0 0 8px; line-height: .9; }

  /* ---------- newsletter, partners ---------- */
  .nl { padding-bottom: 48px; }
  .nl-box { border-top: 1px solid var(--rule-2); padding-top: 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; }
  .nl-box h2 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 30px; margin: 0 0 4px; line-height: 1; }
  .nl-box p { margin: 0; color: var(--ink-3); font-size: 15px; }
  .nl-form { display: flex; gap: 8px; }
  .nl-form input { height: 42px; width: 260px; border-radius: 6px; border: 1px solid var(--rule-2); background: var(--bg); color: var(--ink); padding: 0 12px; outline: none; }
  .nl-form input:focus { border-color: var(--ink); }
  .nl-form button { height: 42px; padding: 0 18px; border-radius: 6px; background: var(--ink); color: var(--bg); font-weight: 600; }
  .nl-consent { grid-column: 1 / -1; font-size: 12px !important; }
  .ad { display: block; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
  .ad img { display: block; width: 100%; height: auto; }
  .ad-label { font-size: 12px; color: var(--ink-3); margin: 0 0 6px; }
  .ad-note { font-size: 11px; line-height: 1.4; color: var(--ink-3); margin: 6px 0 0; }
  .ads-side { position: fixed; top: 112px; left: calc(50% + var(--w) / 2 + 24px); width: 240px; display: grid; gap: 14px; z-index: 5; }
  .ads-inline { padding-bottom: 40px; display: grid; justify-items: start; }
  .ads-inline .ad-box { width: 100%; max-width: 300px; }
  @media (max-width: 1719px) { .ads-side { display: none !important; } }
  @media (min-width: 1720px) { .ads-inline.has-side { display: none !important; } }

  /* ---------- footer ---------- */
  footer { border-top: 1px solid var(--rule); padding: 36px 0 44px; }
  footer .wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  footer img { width: 72px; height: 72px; display: block; }
  footer p { margin: 0; color: var(--ink-3); font-size: 14px; max-width: 560px; }
  footer strong { color: var(--ink); font-weight: 600; }
  .foot-links { display: inline-flex; gap: 16px; margin-right: 16px; }
  .foot-links a { color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-2); }
  .foot-links a:hover { color: var(--ink); text-decoration-color: var(--ink); }
  .preview-bar { background: var(--ink); color: var(--bg); text-align: center; font-size: 14px; font-weight: 600; padding: 8px 12px; }

  /* ---------- responsive ---------- */
  @media (max-width: 980px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 48px; }
    .side { position: static; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .f-grid { grid-template-columns: minmax(0, 1fr); gap: 44px; }
    .mainnav { display: none; }
  }
  @media (max-width: 720px) {
    .fight { grid-template-columns: 32px minmax(0, 1fr); row-gap: 2px; }
    .f-meth, .f-ev { grid-column: 2; }
    .claim { flex-direction: column; align-items: flex-start; }
    .nl-box { grid-template-columns: minmax(0, 1fr); }
    .nl-form input { width: auto; flex: 1; min-width: 0; }
  }
  @media (max-width: 640px) {
    .wrap { padding-left: 16px; padding-right: 16px; }
    .about { margin-left: 16px; padding-right: 16px; }
    .top .wrap { gap: 12px; }
    .brand span { display: none; }
    .search { width: auto; flex: 1; min-width: 0; }
    .lang button { min-width: 26px; padding: 0 4px; font-size: 12px; }
    .intro { padding-top: 28px; }
    .intro p { font-size: 16px; }
    .controls { padding-top: 24px; }
    .scopes { gap: 20px; }
    .scopes a { font-size: 16px; }
    .layout { padding-top: 26px; }
    .row { grid-template-columns: 56px 40px minmax(0, 1fr); min-height: 66px; }
    .rank { font-size: 34px; padding-right: 12px; }
    .row.top1 { min-height: 84px; }
    .row.top1 .rank { font-size: 54px; }
    .row.is-champ .rank, .row.is-champ + .row.top1 .rank { font-size: 42px; }
    .right { display: none; }
    .rec-inline { display: inline; }
    .who { gap: 11px; }
    .name { font-size: 16px; }
    .row.top1 .name, .row.is-champ .name { font-size: 18px; }
    .flag { width: 26px; height: 17px; }
    .flag-lg { width: 44px; height: 29px; }
    .fact div { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
