<style>
  :root {
    --bg: #000;
    --panel: #0c0c0c;
    --panel-2: #121212;
    --line: #1e1e1e;
    --line-2: #2a2a2a;
    --text: #f5f5f5;
    --muted: #8a8a8a;
    --dim: #5c5c5c;
    --up: #2ecc71;
    --down: #ff4d4d;
    --gold: #d9b45a;
    --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .wrap { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 20px; }

  /* Header */
  header.top { position: sticky; top: 0; z-index: 20; background: rgba(0,0,0,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand img { width: 36px; height: 36px; display: block; }
  .brand span { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
  .brand span b { font-weight: 600; font-style: normal; letter-spacing: .28em; font-size: 15px; margin-left: 6px; color: var(--muted); }
  .search { position: relative; margin-left: auto; width: 280px; }
  .search input { width: 100%; height: 38px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); padding: 0 12px 0 36px; font: inherit; font-size: 14px; outline: none; transition: border-color .15s; }
  .search input:focus { border-color: #fff; }
  .search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .results { position: absolute; top: 44px; left: 0; right: 0; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; display: none; box-shadow: 0 18px 40px rgba(0,0,0,.6); }
  .results.open { display: block; }
  .results button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  .results button:last-child { border-bottom: 0; }
  .results button:hover, .results button.active { background: #1b1b1b; }
  .results .r-name { font-weight: 600; font-size: 14px; }
  .results .r-sub { color: var(--muted); font-size: 12px; }
  .results .empty { padding: 12px; color: var(--muted); font-size: 13px; }

  /* Hero */
  .hero { padding: 40px 0 8px; }
  .hero h1 { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: clamp(36px, 7vw, 62px); line-height: .95; margin: 0; letter-spacing: .01em; }
  .hero h1 em { font-style: italic; color: transparent; -webkit-text-stroke: 1.2px #fff; }
  .hero p { color: var(--muted); margin: 12px 0 0; font-size: 14px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--up); display: inline-block; margin-right: 6px; box-shadow: 0 0 0 3px rgba(46,204,113,.15); }

  /* Controls */
  .controls { padding: 24px 0 0; display: grid; gap: 14px; }
  .scopes { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; background: var(--panel); width: max-content; max-width: 100%; }
  .scopes button { padding: 8px 16px; border-radius: 7px; font-weight: 600; font-size: 14px; color: var(--muted); transition: background .15s, color .15s; white-space: nowrap; }
  .scopes button.on { background: #fff; color: #000; }
  .subs { display: flex; gap: 8px; flex-wrap: wrap; }
  .sub { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 13px; font-weight: 600; color: var(--muted); }
  .sub.on { border-color: #fff; color: var(--text); }
  .sub .swatch { width: 8px; height: 8px; border-radius: 50%; }
  .divs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
  .divs::-webkit-scrollbar { display: none; }
  .div-btn { position: relative; padding: 10px 12px 12px; font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 15px; color: var(--dim); white-space: nowrap; transition: color .15s; }
  .div-btn:hover { color: var(--muted); }
  .div-btn.on { color: var(--text); }
  .div-btn.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: #fff; }
  .div-btn sup { font-family: var(--body); font-size: 10px; font-weight: 600; color: var(--dim); margin-left: 3px; letter-spacing: 0; }

  /* Ranking board */
  .board { padding: 26px 0 60px; flex: 1; }
  .board-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .board-head h2 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: clamp(30px, 5vw, 44px); line-height: 1; margin: 0; letter-spacing: .01em; }
  .board-head .meta { color: var(--muted); font-size: 13px; margin-top: 6px; display: flex; align-items: center; gap: 8px; }
  .scope-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line-2); padding: 6px 10px; border-radius: 6px; }

  .list { border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 56px 52px 1fr auto; align-items: center; gap: 4px; padding: 14px 6px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
  .row:hover { background: var(--panel); }
  .rank { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; text-align: center; color: var(--text); }
  .rank.c { font-size: 15px; letter-spacing: .1em; color: #000; background: var(--gold); border-radius: 6px; padding: 6px 0; width: 40px; justify-self: center; }
  .move { font-size: 12px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .move.up { color: var(--up); } .move.down { color: var(--down); } .move.same { color: var(--dim); }
  .move.new { color: #000; background: #fff; border-radius: 4px; font-size: 10px; letter-spacing: .08em; padding: 2px 0; width: 36px; justify-self: center; }
  .who { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .flag { width: 30px; height: 21px; object-fit: cover; border-radius: 3px; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.12); background: #222; display: inline-block; }
  .flag-text { font-size: 9px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
  .flag-empty { background: #1a1a1a; }
  .who-text { min-width: 0; }
  .name { font-weight: 700; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-line { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .org { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; color: #cfcfcf; }
  .org i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  .nick { font-style: italic; }
  .sep { color: var(--dim); }
  .record { font-family: var(--display); font-weight: 600; font-size: 18px; color: #d8d8d8; letter-spacing: .03em; padding-right: 8px; font-variant-numeric: tabular-nums; }
  .row.top1 { background: linear-gradient(90deg, rgba(255,255,255,.06), transparent 70%); }
  .row.top1 .name { font-size: 20px; }
  .empty-state { padding: 60px 20px; text-align: center; color: var(--muted); border-bottom: 1px solid var(--line); }
  .empty-state img { width: 56px; opacity: .25; margin-bottom: 12px; }

  /* Fighter modal */
  .modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.72); backdrop-filter: blur(4px); }
  .modal.open { display: flex; }
  .card { width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; position: relative; }
  .card-top { padding: 26px 24px 20px; border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
  .card-top .bgflag { position: absolute; right: -40px; top: -20px; width: 260px; height: 180px; object-fit: cover; opacity: .14; filter: saturate(1.2); mask-image: linear-gradient(to left, #000 20%, transparent); -webkit-mask-image: linear-gradient(to left, #000 20%, transparent); }
  .card-top h3 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 38px; line-height: .95; margin: 10px 0 0; position: relative; }
  .card-top .nickbig { color: var(--muted); font-style: italic; margin-top: 4px; position: relative; }
  .facts { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 18px; position: relative; }
  .fact small { display: block; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); font-weight: 700; margin-bottom: 4px; }
  .fact div { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .close { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); z-index: 2; }
  .close:hover { background: #1c1c1c; color: #fff; }
  .card-body { padding: 18px 24px 24px; }
  .card-body h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .standing { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .standing:last-child { border-bottom: 0; }
  .standing .st-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .standing .st-sub { font-size: 12px; color: var(--muted); }
  .standing .st-rank { font-family: var(--display); font-weight: 800; font-size: 26px; }
  .standing .st-rank.c { color: var(--gold); font-size: 16px; letter-spacing: .1em; }
  .standing:hover .st-title { text-decoration: underline; text-underline-offset: 3px; }
  .muted { color: var(--muted); font-size: 14px; }

  /* Footer */
  footer { border-top: 1px solid var(--line); padding: 34px 0 40px; }
  footer .wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  footer img { width: 84px; height: 84px; display: block; }
  footer p { margin: 0; color: var(--muted); font-size: 13px; max-width: 520px; }
  footer strong { color: var(--text); font-weight: 600; }

  .preview-bar { background: #fff; color: #000; text-align: center; font-size: 13px; font-weight: 600; padding: 8px 12px; }

  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .top .wrap { gap: 12px; }
    .brand span b { display: none; }
    .brand span { font-size: 20px; }
    .search { width: auto; flex: 1; }
    .hero { padding-top: 28px; }
    .row { grid-template-columns: 40px 40px 1fr; padding: 12px 2px; }
    .rank { font-size: 24px; }
    .rank.c { width: 34px; font-size: 13px; }
    .move.new { width: 32px; }
    .record { display: none; }
    .rec-inline { display: inline !important; }
    .who { gap: 10px; }
    .name { font-size: 15px; }
    .row.top1 .name { font-size: 17px; }
    .flag { width: 26px; height: 18px; }
    .scopes button { padding: 8px 11px; font-size: 13px; }
    .card-top h3 { font-size: 30px; }
  }
  .rec-inline { display: none; }
</style>
</head>

  <div class="card" role="dialog" aria-modal="true" aria-labelledby="fName">
    <button class="close" id="closeModal" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>

  </div>

<script src="common.js"></script>
<script src="data.js"></script>
<script>
(function () {
  const { esc, flag, countryName, fmtDate, normalize } = MML;
  const isPreview = /[?&]preview\b/.test(location.search);
  let D = normalize(isPreview && MML.readDraft() ? MML.readDraft() : window.MMA_DATA);
  if (isPreview) document.getElementById("previewBar").hidden = false;

  const $ = id => document.getElementById(id);
  const orgById = id => D.orgs.find(o => o.id === id);
  const divById = id => D.divisions.find(d => d.id === id);
  const rankedOrgs = () => D.orgs.filter(o => o.ranked);

  let state = { scope: "world", sub: null, div: D.divisions[0] && D.divisions[0].id };
  let lastBoardHash = "#/world";

  function listFor(scope, sub, div) {
    const R = D.rankings;
    if (scope === "world") return (R.world[div] || []);
    const group = (R[scope] || {})[sub] || {};
    return group[div] || [];
  }

  function scopeLabel(scope, sub) {
    if (scope === "world") return "World";
    if (scope === "country") return countryName(sub);
    const o = orgById(sub); return o ? o.name : sub;
  }

  function orgTag(id) {
    const o = orgById(id);
    if (!o) return "";
    return `<span class="org"><i style="background:${esc(o.color || "#888")}"></i>${esc(o.name)}</span>`;
  }

  function moveCell(e, pos) {
    if (e.prev == null || e.prev === "") return `<span class="move same">–</span>`;
    if (e.prev === 0 || e.prev === "new") return `<span class="move new">NEW</span>`;
    const d = Number(e.prev) - pos;
    if (d > 0) return `<span class="move up">▲ ${d}</span>`;
    if (d < 0) return `<span class="move down">▼ ${-d}</span>`;
    return `<span class="move same">–</span>`;
  }

  /* ---------- Routing ---------- */
  function parseHash() {
    const p = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    if (p[0] === "fighter" && p[1]) return { fighter: decodeURIComponent(p[1]) };
    const scope = ["world", "country", "org"].includes(p[0]) ? p[0] : "world";
    let sub = null, div;
    if (scope === "world") div = p[1];
    else { sub = p[1]; div = p[2]; }
    return { scope, sub, div };
  }

  function go(scope, sub, div) {
    location.hash = "#/" + [scope, scope === "world" ? null : sub, div].filter(Boolean).join("/");
  }

  function route() {
    const r = parseHash();
    if (r.fighter) { openFighter(r.fighter); if (!$("list").innerHTML) renderBoard(); return; }
    closeModal(true);
    state.scope = r.scope;
    if (r.scope === "country") state.sub = D.countries.some(c => c.code === r.sub) ? r.sub : (D.countries[0] || {}).code;
    else if (r.scope === "org") state.sub = rankedOrgs().some(o => o.id === r.sub) ? r.sub : (rankedOrgs()[0] || {}).id;
    else state.sub = null;
    state.div = divById(r.div) ? r.div : (D.divisions[0] || {}).id;
    lastBoardHash = location.hash || "#/world";
    renderBoard();
  }

  /* ---------- Rendering ---------- */
  function renderBoard() {
    document.querySelectorAll("#scopes button").forEach(b => b.classList.toggle("on", b.dataset.scope === state.scope));

    // sub chips
    let subsHtml = "";
    if (state.scope === "country") {
      subsHtml = D.countries.map(c =>
        `<a class="sub ${c.code === state.sub ? "on" : ""}" href="#/country/${esc(c.code)}/${esc(state.div)}">${flag(c.code)}${esc(c.name || countryName(c.code))}</a>`).join("");
    } else if (state.scope === "org") {
      subsHtml = rankedOrgs().map(o =>
        `<a class="sub ${o.id === state.sub ? "on" : ""}" href="#/org/${esc(o.id)}/${esc(state.div)}"><span class="swatch" style="background:${esc(o.color || "#888")}"></span>${esc(o.name)}</a>`).join("");
    }
    $("subs").innerHTML = subsHtml;
    $("subs").style.display = subsHtml ? "" : "none";

    // divisions
    $("divs").innerHTML = D.divisions.map(d => {
      const n = listFor(state.scope, state.sub, d.id).length;
      const href = "#/" + [state.scope, state.scope === "world" ? null : state.sub, d.id].filter(Boolean).join("/");
      return `<a class="div-btn ${d.id === state.div ? "on" : ""}" href="${esc(href)}">${esc(d.name)}${n ? `<sup>${n}</sup>` : ""}</a>`;
    }).join("");
    const onBtn = $("divs").querySelector(".on");
    if (onBtn) { const nav = $("divs"); const l = onBtn.offsetLeft - nav.offsetLeft; if (l < nav.scrollLeft || l + onBtn.offsetWidth > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = l - 16; }

    // head
    const div = divById(state.div) || { name: "", limit: "" };
    $("divTitle").textContent = div.name;
    $("divMeta").textContent = div.limit || "";
    let tag = scopeLabel(state.scope, state.sub);
    if (state.scope === "country") tag = flag(state.sub) + esc(tag);
    else if (state.scope === "org") { const o = orgById(state.sub); tag = `<span class="swatch" style="width:8px;height:8px;border-radius:50%;display:inline-block;background:${esc(o ? o.color : "#888")}"></span>` + esc(tag); }
    else tag = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>` + esc(tag);
    $("scopeTag").innerHTML = tag + " Ranking";

    // list
    const list = listFor(state.scope, state.sub, state.div);
    if (!list.length) {
      $("list").innerHTML = `<div class="empty-state"><img src="data:image/webp;base64,UklGRhwMAABXRUJQVlA4IBAMAACQNQCdASqAAIAAPj0ci0QiIaETSd3MIAPEtIAK9H/rPbJ/kPyI7C/2h7Bf0b2o8x/WJmt++v4/8qfyA/Af8X/dPxA/Y71P4AX49/H/8T+WP5AfTh8z2TOs+YF7H/Yf9p+X35Ae2D/TeiXiAfzj9zfzA+KO+LoAfnf/Q/lL/jPpb/gf+L/kfy69l/5f/jv+z/nvgG/mn9M/5X99/dz9//qt9eP7S/f////sy/WpoeCUbA4M0POpNBl0TZuEur3LA9rX1WPX8J7uEoWVs81GRSqLT0XGuTX0nbL0PS9b3BCf+/o1GNP9apZnz8xugbav0DbyK551KxuvdfEW8WNsfTMwPscy2qyNFoz/LEKBXb57ww97HHTZahNin4sBtfngw7Xh3dsf13SiVC58A+bYyzFI6xNP7co2ybtZCLjSzHKod/TMZdA3pszwM8AptqbGl7cDKIkTv+gqg+XsXV0w4sVKQkyNwxOMnXOSwL6B2RDwwxqf50woobKWE/K2wsn7ep1fMnwaxUawYh7ot6YpYMCkYTSkzajusNJ5UKV0nQ+UsYjm6AT5A75a/TF+hVFxcR3RQq9igAD+/w1m9PUGzQQJVrv8o0n8tzlbbw/bGVTQFeE8zMSRh/1e/yoL8CG/YunhAvCjM9V+kS5HgTEYb/De6/tZKTEjiIUnpOT4OS6svnxs6KHXR0/x8Q6H7wcZj9TFkdS/VX4X39Z2jpQ0f0gH+HqA4cR+L40MHSIMMNDc8QEUVwUsitMgRT/W7eVxJmyAALDhf6XuF4AOneb6/Jou+Mn5ZFeNv3/pZMpSIC47+W8svCWW92aR0AQf6NcyXJ1ZELWdqYpZpkUhMuPWDtbRP/KuLFS8b+++v/ZNeAaVIC+9qNvqyEm9yK71l+oDExU89OMcev+cx/eC3i5jwPMhKTtSfqj68oWSYw5ypWYXFwYwpP7fswcS7NgZm1mpeSFryIHiga+BE0IAG2Ge4qUlW1Dnss4+MNJZNaoplfecXGLVjfMjtrX2QPVMtI5QTp50+vpqv7sn+rpgTWKMj7PeoT7GcIATqfAjLWgKpSd/5C7bvo2nC8tJftcIDVNHOHB2J8UeNvmr8ADrXcop2j7u5N9Nnx6y/srOZVCmVb6O9ptLuRd2HbDKyiV4e8tXZRCbe7XBzrT/BmyQIDwAlTxwiReFV/ByaYeaQqqZwqCpFoBlGwMBQHeuvcITDwUrV/yMz/1ChTuZRp0psoyx7YsYrO0gQv1smkRbha2Qx4SQVOZjXCb7Glp3xZbvuDI41TFiqEwQR6EbxpaqKL/Sj/E2siwUhNJOlUuMj8mUobab4qg6jiJpG991uabkcBdvpwM71cT+taltUdDEyQanN+QsuCzxltpv7M8j74tBX1PlblYnkbYA/reBWRnzBE6FkAxsWU3YQ1gI6aQiBf/2XIGCPWp/UPspzbqpxfDiiqKXCg0TPaBGE3FSBSloh15OSDzj4aR8woiN9p90M4EyU78hcjex4W5pJqYMk5x9Zh18xk02zC6qqDrcvC5LOStf34+7nOom3QKnkWO2imkbhv6a8ZTrYH4VvHRzb/CgdiDtWZah4ZfixjS21inaqiK0APS6k29eJCvEsG1wVQ8176GlhikvR1fEgX32tfKRXow38JePc3fjpOCVP/DTGXMfHzjkzoiKAI6RHd3KHNmDOTGx+/n5LiTLRcSVnd/nPab3VNhv8f0DKVbOoL0BiGzcgcmJeaqmmpX2DesRvMnMktVCDdkFmRp2Vc6b8ZP4a28ISa5WrjZECYL668fSUKZFjIYueaAr/W09DyG1S4SSjrxFkSHQ2pwA0BSGzRqGyIAxCrovlkeJyqpYxg8WRMvDXUnXfgEud6q/xuQnDJTQKX8aQHSjvH8Va UURP1wM5k8/AnD1bZ2VZ26/ynak14p26s4qTGZVltiYfqpgTq9bIXHBef0rj5/v7RHB8M0Q+BrGPbx1GXfKKN9s+8mwmOqb1g4ywB5HYcPwBNC6VRCAakhCveNfvOWrdml8oTHewUAsdu2gkoJ0wqIT0EW0HIC62ukTk5d86XZ5uVLAfWMUUouceZZ+ajaxrsw/EVD+nhm9OvflxtErXW0fj4xeqjKQ/apEAAAA" alt=""><div>No fighters ranked in this division yet.</div></div>`;
      return;
    }
    let pos = 0;
    $("list").innerHTML = list.map((e, i) => {
      const f = D.fighters[e.f]; if (!f) return "";
      const champ = !!e.c;
      if (!champ) pos++;
      const rankHtml = champ ? `<span class="rank c">C</span>` : `<span class="rank">${pos}</span>`;
      const bits = [orgTag(f.org)];
      if (f.nick) bits.push(`<span class="nick">“${esc(f.nick)}”</span>`);
      if (f.record) bits.push(`<span class="rec-inline">${esc(f.record)}</span>`);
      const subLine = bits.filter(Boolean).join(`<span class="sep">·</span>`);
      return `<a class="row ${i === 0 ? "top1" : ""}" href="#/fighter/${encodeURIComponent(e.f)}">
        ${rankHtml}
        ${champ ? `<span class="move same" style="color:var(--gold);font-size:10px;letter-spacing:.1em">CHAMP</span>` : moveCell(e, pos)}
        <span class="who">${flag(f.country)}<span class="who-text"><div class="name">${esc(f.name)}</div><div class="sub-line">${subLine}</div></span></span>
        <span class="record">${esc(f.record || "")}</span>
      </a>`;
    }).join("");
  }

  function standingsOf(id) {
    const out = [];
    const add = (scope, sub, list, divId) => {
      let pos = 0;
      for (const e of list) {
        if (!e.c) pos++;
        if (e.f === id) out.push({ scope, sub, div: divId, rank: e.c ? "C" : pos });
      }
    };
    for (const d of D.divisions) {
      add("world", null, D.rankings.world[d.id] || [], d.id);
      for (const c of D.countries) add("country", c.code, ((D.rankings.country[c.code] || {})[d.id]) || [], d.id);
      for (const o of rankedOrgs()) add("org", o.id, ((D.rankings.org[o.id] || {})[d.id]) || [], d.id);
    }
    const order = { world: 0, country: 1, org: 2 };
    return out.sort((a, b) => order[a.scope] - order[b.scope]);
  }

  function openFighter(id) {
    const f = D.fighters[id];
    if (!f) { location.hash = lastBoardHash; return; }
    const o = orgById(f.org);
    const st = standingsOf(id);
    const stHtml = st.length ? st.map(s => {
      const href = "#/" + [s.scope, s.sub, s.div].filter(Boolean).join("/");
      const icon = s.scope === "country" ? flag(s.sub) : s.scope === "org" ? `<span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:${esc((orgById(s.sub) || {}).color || "#888")}"></span>` : "";
      return `<a class="standing" href="${esc(href)}">
        <div><div class="st-title">${icon}${esc(scopeLabel(s.scope, s.sub))} · ${esc((divById(s.div) || {}).name || s.div)}</div>
        <div class="st-sub">${s.scope === "world" ? "Global ranking" : s.scope === "country" ? "National ranking" : "Organization ranking"}</div></div>
        <div class="st-rank ${s.rank === "C" ? "c" : ""}">${s.rank === "C" ? "CHAMPION" : "#" + s.rank}</div>
      </a>`;
    }).join("") : `<p class="muted">Currently unranked.</p>`;

    $("fighterCard").innerHTML = `
      <div class="card-top">
        ${f.country ? `<img class="bgflag" src="https://flagcdn.com/w320/${esc(f.country)}.png" alt="" onerror="this.remove()">` : ""}
        ${flag(f.country)}
        <h3 id="fName">${esc(f.name)}</h3>
        ${f.nick ? `<div class="nickbig">“${esc(f.nick)}”</div>` : ""}
        <div class="facts">
          <div class="fact"><small>Country</small><div>${esc(countryName(f.country)) || "–"}</div></div>
          <div class="fact"><small>Organization</small><div>${o ? orgTag(f.org) : "–"}</div></div>
          ${f.record ? `<div class="fact"><small>Record</small><div>${esc(f.record)}</div></div>` : ""}
        </div>
      </div>
      <div class="card-body"><h4>Current standings</h4>${stHtml}</div>`;
    $("modal").classList.add("open");
    $("modal").setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }

  function closeModal(silent) {
    if (!$("modal").classList.contains("open")) return;
    $("modal").classList.remove("open");
    $("modal").setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if (!silent) location.hash = lastBoardHash;
  }

  /* ---------- Search ---------- */
  const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  let active = 0, hits = [];
  function search() {
    const q = norm($("q").value.trim());
    const box = $("results");
    if (!q) { box.classList.remove("open"); return; }
    hits = Object.entries(D.fighters)
      .filter(([id, f]) => norm(f.name).includes(q) || (f.nick && norm(f.nick).includes(q)))
      .sort((a, b) => norm(a[1].name).indexOf(q) - norm(b[1].name).indexOf(q))
      .slice(0, 7);
    active = 0;
    box.innerHTML = hits.length ? hits.map(([id, f], i) => {
      const o = orgById(f.org);
      return `<button data-id="${esc(id)}" class="${i === 0 ? "active" : ""}">${flag(f.country)}<span><div class="r-name">${esc(f.name)}</div><div class="r-sub">${esc(countryName(f.country))}${o ? " · " + esc(o.name) : ""}</div></span></button>`;
    }).join("") : `<div class="empty">No fighter found</div>`;
    box.classList.add("open");
  }
  function pick(id) { $("q").value = ""; $("results").classList.remove("open"); $("q").blur(); location.hash = "#/fighter/" + encodeURIComponent(id); }
  $("q").addEventListener("input", search);
  $("q").addEventListener("keydown", e => {
    const btns = [...$("results").querySelectorAll("button")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (!btns.length) return;
      active = (active + (e.key === "ArrowDown" ? 1 : -1) + btns.length) % btns.length;
      btns.forEach((b, i) => b.classList.toggle("active", i === active));
    } else if (e.key === "Enter" && hits[active]) pick(hits[active][0]);
    else if (e.key === "Escape") { $("results").classList.remove("open"); $("q").blur(); }
  });
  $("results").addEventListener("mousedown", e => { const b = e.target.closest("button[data-id]"); if (b) { e.preventDefault(); pick(b.dataset.id); } });
  $("q").addEventListener("blur", () => setTimeout(() => $("results").classList.remove("open"), 120));

  /* ---------- Events ---------- */
  $("scopes").addEventListener("click", e => {
    const b = e.target.closest("button[data-scope]"); if (!b) return;
    const s = b.dataset.scope;
    const sub = s === "country" ? (D.countries[0] || {}).code : s === "org" ? (rankedOrgs()[0] || {}).id : null;
    go(s, sub, state.div);
  });
  $("closeModal").addEventListener("click", () => closeModal());
  $("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  window.addEventListener("hashchange", route);

  $("updated").textContent = fmtDate(D.updated);
  $("year").textContent = new Date().getFullYear();
  const ranked = new Set();
  const collect = g => Object.values(g).forEach(l => l.forEach(e => ranked.add(e.f)));
  collect(D.rankings.world);
  Object.values(D.rankings.country).forEach(collect);
  Object.values(D.rankings.org).forEach(collect);
  $("stats").textContent = `${ranked.size} ranked fighters · ${D.divisions.length} divisions`;

  route();
})();
</script>
